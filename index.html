<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RTL Caption Fixer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --gwc-green:#3FAE2A; }
    body { background:#f6f7f8; color:#1f2328; }
    .app-wrap { max-width:900px; margin:48px auto; padding:0 16px; }
    .card { border:0; border-radius:18px; box-shadow:0 8px 30px rgba(0,0,0,.06); }
    .form-control { min-height:260px; resize:vertical; border-radius:14px; line-height:1.75; }
    .form-control:focus { border-color:var(--gwc-green); box-shadow:0 0 0 .25rem rgba(63,174,42,.12); }
    .btn-fix { background:var(--gwc-green); border-color:var(--gwc-green); color:#fff; }
    .btn-fix:hover { background:#349323; border-color:#349323; color:#fff; }
    .meta { font-size:.9rem; color:#6c757d; }
    #outputSection { display:none; }
    footer { color:#8a8f98; font-size:.85rem; text-align:center; margin-top:24px; }
  </style>
</head>
<body>
  <main class="app-wrap">
    <h1 class="h3 fw-semibold mb-4">RTL Caption Fixer</h1>
    <div class="card">
      <div class="card-body p-4 p-md-5">
        <textarea id="inputText" class="form-control" dir="auto" placeholder="Paste your English + Arabic caption here..."></textarea>

        <div class="d-flex justify-content-between align-items-center mt-2 gap-3 flex-wrap">
          <div id="charCount" class="meta">0 / 2,200</div>
          <div class="d-flex gap-2">
            <button id="clearBtn" type="button" class="btn btn-light border">Clear</button>
            <button id="fixBtn" type="button" class="btn btn-fix px-4">Fix Direction</button>
          </div>
        </div>

        <div id="outputSection" class="mt-4 pt-4 border-top">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="fw-medium">Corrected caption</span>
            <button id="copyBtn" type="button" class="btn btn-outline-dark btn-sm">Copy</button>
          </div>
          <textarea id="outputText" class="form-control" dir="auto" readonly></textarea>
        </div>
      </div>
    </div>

    <footer>© Anooj Korampatta | Marketing Team</footer>
  </main>

<script>
const input = document.getElementById('inputText');
const output = document.getElementById('outputText');
const outputSection = document.getElementById('outputSection');
const charCount = document.getElementById('charCount');

const LRI = '\u2066';
const RLI = '\u2067';
const PDI = '\u2069';

function cleanControls(text) {
  return text.replace(/[\u200E\u200F\u202A-\u202E\u2066-\u2069]/g, '');
}

function firstStrongDirection(text) {
  for (const ch of text) {
    if (/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/u.test(ch)) return 'rtl';
    if (/[A-Za-z]/.test(ch)) return 'ltr';
  }
  const ar = (text.match(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/gu) || []).length;
  const en = (text.match(/[A-Za-z]/g) || []).length;
  return ar > en ? 'rtl' : 'ltr';
}

function protectEmbeddedLatinInArabic(line) {
  const pattern = /(https?:\/\/\S+|www\.\S+|[@#][A-Za-z0-9_.-]+|[A-Za-z0-9][A-Za-z0-9 .&+_\/:'’\-]*[A-Za-z0-9])/g;
  return line.replace(pattern, match => LRI + match + PDI);
}

function protectEmbeddedArabicInEnglish(line) {
  const pattern = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF][\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\s،؛؟ـً-ٟ]*[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/gu;
  return line.replace(pattern, match => RLI + match + PDI);
}

function fixLine(line) {
  if (!line.trim()) return '';
  const dir = firstStrongDirection(line);

  if (dir === 'rtl') {
    return RLI + protectEmbeddedLatinInArabic(line) + PDI;
  }
  return LRI + protectEmbeddedArabicInEnglish(line) + PDI;
}

function fixCaption(text) {
  return cleanControls(text).split('\n').map(fixLine).join('\n');
}

function updateCount() {
  charCount.textContent = `${input.value.length.toLocaleString()} / 2,200`;
}

input.addEventListener('input', updateCount);

document.getElementById('fixBtn').addEventListener('click', () => {
  output.value = fixCaption(input.value);
  outputSection.style.display = 'block';
});

document.getElementById('clearBtn').addEventListener('click', () => {
  input.value = '';
  output.value = '';
  outputSection.style.display = 'none';
  updateCount();
  input.focus();
});

document.getElementById('copyBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(output.value);
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied';
    setTimeout(() => btn.textContent = 'Copy', 1400);
  } catch (e) {
    output.select();
    document.execCommand('copy');
  }
});

updateCount();
</script>
</body>
</html>
