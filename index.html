<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RTL Caption Fixer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root{--brand:#3FAE2A;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--page:#f7f8fa}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--page);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .app-shell{max-width:900px;margin:0 auto;padding:54px 20px 26px}
    h1{font-size:2rem;font-weight:750;letter-spacing:-.03em;margin-bottom:28px}
    .card-simple{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(17,24,39,.05);overflow:hidden}
    .editor-wrap{padding:18px}
    textarea{width:100%;min-height:230px;resize:vertical;border:1px solid var(--line)!important;border-radius:14px!important;padding:16px!important;font-size:1rem!important;line-height:1.8!important;box-shadow:none!important;background:#fff!important}
    textarea:focus{border-color:#b8dcae!important;box-shadow:0 0 0 .2rem rgba(63,174,42,.08)!important}
    .actions{padding:0 18px 18px;display:flex;gap:10px;align-items:center}
    .btn-brand{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700;padding:.65rem 1.1rem}
    .btn-brand:hover,.btn-brand:focus{background:#349522;border-color:#349522;color:#fff}
    .output-section{display:none;border-top:1px solid var(--line);padding:18px}
    .output-section.show{display:block}
    .output-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .output-head span{font-size:.9rem;color:var(--muted);font-weight:600}
    #result{direction:rtl;text-align:right;unicode-bidi:plaintext}
    .footer{text-align:center;margin-top:24px;color:#8a9099;font-size:.84rem}
    @media(max-width:575.98px){.app-shell{padding-top:32px}h1{font-size:1.7rem}.output-head{align-items:flex-start}.actions{flex-wrap:wrap}}
  </style>
</head>
<body>
  <main class="app-shell">
    <h1>RTL Caption Fixer</h1>

    <section class="card-simple">
      <div class="editor-wrap">
        <textarea id="input" class="form-control" dir="auto" maxlength="2200" placeholder="Paste your Arabic + English caption here..."></textarea>
        <div class="d-flex justify-content-end mt-2">
          <span id="charCount" class="small text-secondary">0 / 2,200</span>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-brand" id="fixBtn"><i class="bi bi-magic me-2"></i>Fix Direction</button>
        <button class="btn btn-outline-secondary" id="clearBtn"><i class="bi bi-x-lg me-2"></i>Clear</button>
      </div>

      <div class="output-section" id="outputSection">
        <div class="output-head">
          <span>Corrected text</span>
          <button class="btn btn-outline-dark btn-sm" id="copyBtn"><i class="bi bi-clipboard me-2"></i>Copy</button>
        </div>
        <textarea id="result" class="form-control" readonly></textarea>
      </div>
    </section>

    <footer class="footer">© AnoojKorampatta | Marketing Team</footer>
  </main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="copyToast" class="toast align-items-center text-bg-dark border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex"><div class="toast-body">Corrected caption copied.</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const input = document.getElementById('input');
    const result = document.getElementById('result');
    const outputSection = document.getElementById('outputSection');
    const charCount = document.getElementById('charCount');
    const clearBtn = document.getElementById('clearBtn');
    const LRI = '\u2066';
    const RLI = '\u2067';
    const PDI = '\u2069';

    function stripDirectionalControls(text){
      return text.replace(/[\u200E\u200F\u202A-\u202E\u2066-\u2069]/g,'');
    }

    function protectLatinSegments(line){
      const tokenPattern = /(https?:\/\/\S+|www\.\S+|[\w.+-]+@[\w.-]+\.\w+|#[A-Za-z0-9_]+|[A-Za-z0-9]+(?:[\s\u00A0]+[A-Za-z0-9][A-Za-z0-9&+._\/-]*)*)/g;
      return line.replace(tokenPattern, match => LRI + match + PDI);
    }

    function fixCaption(text){
      const clean = stripDirectionalControls(text);
      return clean.split('\n').map(line => {
        if (!line.trim()) return '';
        return RLI + protectLatinSegments(line) + PDI;
      }).join('\n');
    }

    document.getElementById('fixBtn').addEventListener('click', () => {
      if (!input.value.trim()) return;
      result.value = fixCaption(input.value);
      outputSection.classList.add('show');
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      if (!result.value) return;
      await navigator.clipboard.writeText(result.value);
      bootstrap.Toast.getOrCreateInstance(document.getElementById('copyToast')).show();
    });

    function updateCharCount(){
      charCount.textContent = `${input.value.length.toLocaleString()} / 2,200`;
    }

    input.addEventListener('input', () => {
      updateCharCount();
      outputSection.classList.remove('show');
      result.value = '';
    });

    clearBtn.addEventListener('click', () => {
      input.value = '';
      result.value = '';
      outputSection.classList.remove('show');
      updateCharCount();
      input.focus();
    });

    updateCharCount();
  </script>
</body>
</html>
