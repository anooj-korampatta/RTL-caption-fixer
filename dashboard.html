<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RTL Caption Fixer — Usage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --brand:#3FAE2A; }
    body { background:#f6f7f8; color:#1f2328; }
    .page { max-width:1120px; margin:42px auto; padding:0 16px; }
    .card { border:0; border-radius:18px; box-shadow:0 8px 30px rgba(0,0,0,.05); }
    .metric { font-size:2rem; font-weight:700; letter-spacing:-.03em; }
    .metric-label { color:#6c757d; font-size:.9rem; }
    .brand-dot { width:9px; height:9px; border-radius:50%; background:var(--brand); display:inline-block; }
    #dashboard, #loginError { display:none; }
    canvas { max-height:320px; }
  </style>
</head>
<body>
  <main class="page">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <div class="d-flex align-items-center gap-2">
          <span class="brand-dot"></span>
          <h1 class="h3 mb-0 fw-semibold">RTL Caption Fixer Usage</h1>
        </div>
      </div>
      <button id="logoutBtn" class="btn btn-light border btn-sm d-none">Sign out</button>
    </div>

    <div id="loginCard" class="card mx-auto" style="max-width:460px;">
      <div class="card-body p-4">
        <h2 class="h5 mb-3">Admin sign in</h2>
        <div id="loginError" class="alert alert-danger py-2"></div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input id="email" type="email" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input id="password" type="password" class="form-control">
        </div>
        <button id="loginBtn" class="btn btn-dark w-100">Sign in</button>
      </div>
    </div>

    <section id="dashboard">
      <div class="row g-3 mb-3">
        <div class="col-6 col-lg-3">
          <div class="card h-100"><div class="card-body">
            <div id="totalUses" class="metric">—</div>
            <div class="metric-label">Total uses</div>
          </div></div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="card h-100"><div class="card-body">
            <div id="todayUses" class="metric">—</div>
            <div class="metric-label">Today</div>
          </div></div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="card h-100"><div class="card-body">
            <div id="weekUses" class="metric">—</div>
            <div class="metric-label">Last 7 days</div>
          </div></div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="card h-100"><div class="card-body">
            <div id="monthUses" class="metric">—</div>
            <div class="metric-label">Last 30 days</div>
          </div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <h2 class="h5 mb-1">Usage trend</h2>
              <div class="text-secondary small">Fix Direction clicks per day — last 30 days</div>
            </div>
            <button id="refreshBtn" class="btn btn-light border btn-sm">Refresh</button>
          </div>
          <canvas id="usageChart"></canvas>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script>
  const SUPABASE_URL = 'https://wlgeyshhhxkczcllpjme.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_sf_rQJXCZ9NOyZxAlO7wzQ_Xxh36NEv';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let chart;

  const loginCard = document.getElementById('loginCard');
  const dashboard = document.getElementById('dashboard');
  const logoutBtn = document.getElementById('logoutBtn');
  const loginError = document.getElementById('loginError');

  async function loadStats() {
    const { data, error } = await supabaseClient.rpc('get_rtl_fixer_dashboard', { p_days: 30 });

    if (error) {
      alert(error.message);
      return;
    }

    const stats = data;
    document.getElementById('totalUses').textContent = Number(stats.total_uses || 0).toLocaleString();
    document.getElementById('todayUses').textContent = Number(stats.today_uses || 0).toLocaleString();
    document.getElementById('weekUses').textContent = Number(stats.last_7_days || 0).toLocaleString();
    document.getElementById('monthUses').textContent = Number(stats.last_30_days || 0).toLocaleString();

    const labels = (stats.daily || []).map(x => x.day);
    const values = (stats.daily || []).map(x => x.uses);

    if (chart) chart.destroy();
    chart = new Chart(document.getElementById('usageChart'), {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'Uses',
          data: values,
          borderWidth: 2,
          tension: .3,
          pointRadius: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display:false } },
        scales: {
          y: { beginAtZero:true, ticks:{ precision:0 } },
          x: { grid:{ display:false } }
        }
      }
    });
  }

  async function showForSession(session) {
    const loggedIn = !!session;
    loginCard.style.display = loggedIn ? 'none' : 'block';
    dashboard.style.display = loggedIn ? 'block' : 'none';
    logoutBtn.classList.toggle('d-none', !loggedIn);

    if (loggedIn) await loadStats();
  }

  document.getElementById('loginBtn').addEventListener('click', async () => {
    loginError.style.display = 'none';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      loginError.textContent = error.message;
      loginError.style.display = 'block';
      return;
    }
    await showForSession(data.session);
  });

  logoutBtn.addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    await showForSession(null);
  });

  document.getElementById('refreshBtn').addEventListener('click', loadStats);

  supabaseClient.auth.getSession().then(({ data }) => showForSession(data.session));
  </script>
</body>
</html>
